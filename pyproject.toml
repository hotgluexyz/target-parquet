[tool.poetry]
name = "target-parquet"
version = "0.0.21"
description = "`target-parquet` is a Singer target for Parquet, built with the Meltano SDK for Singer Targets."
authors = ["Hotglue"]
keywords = [
    "ELT",
    "Parquet",
]
license = "Apache 2.0"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
requests = "^2.25.1"
hotglue-singer-sdk = ">=1.0.40"
pyarrow = ">=22.0.0"

[tool.poetry.dev-dependencies]
pytest = "^6.2.5"
tox = "^3.24.4"
flake8 = "^3.9.2"
black = "^21.9b0"
pydocstyle = "^6.1.1"
mypy = "^0.910"
types-requests = "^2.26.1"
isort = "^5.10.1"

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "target_parquet"

[build-system]
# poetry-core <1.8 fails to import on 3.14 (six.moves); keep a low floor for older builders.
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
target-parquet = 'target_parquet.target:TargetParquet.cli'
