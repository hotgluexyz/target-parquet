name: CI Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pytest>=7.4,<9'
          pip install .

      - name: Run tests
        run: |
          set +e
          pytest target_parquet/tests/ -v 2>&1 | tee pytest-out.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # pyarrow 11 + ZSTD can SIGSEGV during interpreter teardown on Linux
          # after a fully green suite. Treat that as success when no tests failed.
          if [ "$status" -eq 139 ] && grep -qE '[0-9]+ passed' pytest-out.txt && ! grep -qE '[1-9][0-9]* failed' pytest-out.txt; then
            echo "Ignoring pyarrow interpreter-teardown SIGSEGV after a green suite (exit 139)"
            exit 0
          fi
          exit "$status"
